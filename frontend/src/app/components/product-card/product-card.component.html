<div
  class="group flex h-full transform cursor-pointer flex-col overflow-hidden rounded-md border border-gray-300 shadow-lg transition-transform hover:scale-[1.03] hover:shadow-xl"
  [routerLink]="'/product/' + product._id"
  [attr.aria-labelledby]="
    'product-title-' + product._id + ' product-description-' + product._id
  "
>
  <div class="relative">
    <img
      [src]="product.images[0]"
      [alt]="product.name"
      class="h-52 w-full object-cover"
      loading="lazy"
    />

    @if (product.discount > 0) {
      <span
        class="absolute left-2 top-2 rounded-md bg-red-500 px-2 py-1 text-xs font-semibold text-white"
        id="discount-badge-{{ product._id }}"
      >
        -{{ product.discount }}%
      </span>
    }
  </div>

  <div class="flex flex-grow flex-col p-4">
    <h6
      class="mb-2 mt-0 font-semibold text-gray-900"
      id="product-title-{{ product._id }}"
    >
      {{ product.name }}
    </h6>

    <p
      class="line-clamp-2 flex-grow text-sm text-gray-600"
      id="product-description-{{ product._id }}"
    >
      {{ product.shortDescription }}
    </p>

    <div class="mt-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        @if (product.discount > 0) {
          <p class="text-base text-gray-500 line-through">
            ${{ product.price }}
          </p>
        }
        <p class="text-lg font-bold text-red-600">${{ sellingPrice }}</p>
      </div>

      <div class="flex items-center space-x-2">
        @if (!authService.isAdmin) {
          <button
            mat-mini-fab
            class="text-red-600 transition-all hover:text-red-800"
            (click)="onAddToWishlist($event, product)"
            [attr.aria-pressed]="isInWishlist(product) ? 'true' : 'false'"
            aria-label="Add to Wishlist"
          >
            <mat-icon>{{
              isInWishlist(product) ? "favorite" : "favorite_border"
            }}</mat-icon>
          </button>

          <button
            mat-mini-fab
            class="text-green-700 transition-all hover:text-green-900"
            (click)="onAddToCart($event, product)"
            [attr.aria-pressed]="isInCart(product) ? 'true' : 'false'"
            aria-label="Add to Cart"
          >
            <mat-icon>{{
              isInCart(product) ? "remove_shopping_cart" : "add_shopping_cart"
            }}</mat-icon>
          </button>
        }
      </div>
    </div>
  </div>
</div>
