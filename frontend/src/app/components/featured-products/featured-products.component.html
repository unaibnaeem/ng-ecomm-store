<div class="flex min-h-screen flex-col px-4 py-8 md:px-20">
  @if (!isLoading) {
    <h3 class="mb-4 text-center text-2xl font-bold sm:text-3xl">
      Featured Products
    </h3>

    <div class="flex-1">
      <div class="-mx-1 flex flex-wrap">
        @for (product of featuredProducts; track $index) {
          <div class="mb-6 w-full px-1 sm:w-1/2 md:w-1/3 lg:w-1/4">
            <app-product-card [product]="product" />
          </div>
        } @empty {
          <div
            class="col-span-full flex flex-col items-center justify-center py-12 text-center"
          >
            <p class="text-lg font-semibold text-gray-700 sm:text-xl">
              No Products Found
            </p>
            <p class="text-gray-500">Try adjusting your filters.</p>
          </div>
        }
      </div>
    </div>

    <div class="mt-auto flex items-center justify-center pt-6">
      <button
        (click)="previousPage()"
        [disabled]="paginationService.currentPage === 1"
        class="mb-2 rounded-lg bg-gray-300 px-5 py-2 text-gray-700 hover:bg-gray-400 disabled:opacity-50 sm:mx-2 sm:mb-0"
      >
        Previous
      </button>
      <span class="px-4 py-2 text-sm sm:text-base">
        Page {{ paginationService.currentPage }} of
        {{ paginationService.totalPages }}
      </span>
      <button
        (click)="nextPage()"
        [disabled]="
          paginationService.currentPage >= paginationService.totalPages
        "
        class="mt-2 rounded-lg bg-gray-300 px-5 py-2 text-gray-700 hover:bg-gray-400 disabled:opacity-50 sm:mx-2 sm:mt-0"
      >
        Next
      </button>
    </div>
  } @else {
    <div class="flex justify-center py-6">
      <div class="loader"></div>
    </div>
  }
</div>
