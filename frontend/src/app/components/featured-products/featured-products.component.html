<div class="flex min-h-screen flex-col px-20 py-8">
  <h3 class="mb-4 text-3xl font-bold">Featured Products</h3>

  <div class="flex-1">
    <div class="flex flex-wrap">
      @for (product of featuredProducts; track $index) {
        <div class="mb-6 w-full px-1 sm:w-1/2 md:w-1/3 lg:w-1/4">
          <app-product-card [product]="product" />
        </div>
      } @empty {
        <div
          class="col-span-full flex flex-col items-center justify-center py-12 text-center"
        >
          <p class="text-xl font-semibold text-gray-700">No Products Found</p>
          <p class="text-gray-500">Try adjusting your filters.</p>
        </div>
      }
    </div>
  </div>

  <div class="mt-auto flex justify-center pt-6">
    <button
      (click)="previousPage()"
      [disabled]="paginationService.currentPage === 1"
      class="mx-2 rounded-lg bg-gray-300 px-4 py-2 text-gray-700 hover:bg-gray-400 disabled:opacity-50"
    >
      Previous
    </button>
    <span class="px-4 py-2"
      >Page {{ paginationService.currentPage }} of
      {{ paginationService.totalPages }}</span
    >
    <button
      (click)="nextPage()"
      [disabled]="paginationService.currentPage >= paginationService.totalPages"
      class="mx-2 rounded-lg bg-gray-300 px-4 py-2 text-gray-700 hover:bg-gray-400 disabled:opacity-50"
    >
      Next
    </button>
  </div>
</div>
