<div class="md:px-30 my-10 px-4 sm:px-20 lg:px-40">
  <div class="flex flex-col items-center justify-between sm:flex-row">
    <h3 class="text-xl font-bold sm:text-2xl">Manage Brands</h3>
    <button
      mat-raised-button
      color="primary"
      class="sm:-mt-3"
      routerLink="/admin/brands/add"
    >
      Add New Brand
    </button>
  </div>
  <div class="mt-4 overflow-x-auto shadow">
    <mat-form-field class="w-full">
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Search"
        #input
      />
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row._id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let row">
          <button
            mat-raised-button
            color="accent"
            class="mb-1 mr-4 sm:mb-0"
            [routerLink]="'/admin/brands/' + row._id"
          >
            Edit
          </button>
          <button
            mat-raised-button
            color="warn"
            (click)="onDeleteBrands(row._id)"
          >
            Delete
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">
          No data matching the filter "{{ input.value }}"
        </td>
      </tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[10, 25, 50, 100]"
      aria-label="Select"
    ></mat-paginator>
  </div>
</div>
